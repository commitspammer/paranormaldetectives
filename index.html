<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paranormal Detectives – Séance Sandbox</title>
<style>
:root{color-scheme:dark;--chalk:#f3f1ea;--blood:#c4172b;--gold:#e6c274;--ecto:#7fe3d1;--ink:#efe9ff;--fs:clamp(14px,2.1vh,26px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#120e1f;color:var(--ink);font:var(--fs)/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font-family:Georgia,"Palatino Linotype",serif;margin:0;font-size:1.25em}
#app{height:100vh;display:grid;grid-template-columns:27fr 40fr 33fr;gap:1.2vh;padding:1.2vh}
.panel{min-height:0;min-width:0;border-radius:1.6vh;padding:1.6vh;display:flex;flex-direction:column;gap:1vh;position:relative}
.head{display:flex;justify-content:space-between;align-items:center;gap:1vh}
.mini{background:#0004;border:1px solid #fff4;border-radius:1vh;padding:.25em .8em}
.mini:hover{border-color:var(--gold)}

#ouija,#sliders,.mk{-webkit-user-select:none;user-select:none}
/* body */
#bodyP{background:#262a33;border:1px solid #3b4150}
#stage{flex:1;min-height:0;position:relative}
#bsvg{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
#sex{position:absolute;top:0;left:0;width:9vh;height:9vh;border-radius:50%;border:2px solid var(--chalk);background:#0005;padding:1vh;display:grid;place-items:center}
#sex svg{width:100%;height:100%}
#desc{display:block;resize:none;overflow:hidden;line-height:1.25;width:100%;background:#1a1d24;border:1px solid #4a5163;border-radius:1vh;padding:.6em .8em;color:var(--chalk);font-family:Georgia,serif;font-style:italic;font-size:1.5em}
.tok{cursor:grab}

/* ouija */
#ouP{background:linear-gradient(160deg,#6b4423,#4a2c14);border:3px solid #2c1a0b;box-shadow:inset 0 0 6vh #0008}
#ouP h2{color:var(--gold);letter-spacing:.35em}
#ouija{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1.2vh;padding:1.2vh;border:2px solid var(--gold);border-radius:2vh;background:#0002}
.grp{position:relative;border:1.5px solid #e6c27499;border-radius:1.4vh;background:#e6c2741a;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;min-height:0;color:var(--gold);padding:0}
.grp:hover{background:#e6c27433}
.letters{font-family:Georgia,serif;font-size:calc(7.5vh*var(--ls,1));line-height:1.05;display:flex;justify-content:center;gap:0 .35em;width:max-content;max-width:none}
.letters .row{display:contents}
#ouija.two .letters{flex-direction:column;align-items:center}
#ouija.two .letters .row{display:flex;gap:.35em}
.marks{display:flex;gap:.6vh;flex-wrap:wrap;justify-content:center;min-height:5.4vh}
.mk{width:5.2vh;height:5.2vh;border-radius:50%;border:.5vh solid #f6e7b8;background:radial-gradient(circle at 35% 30%,#fff7d6,#c99a3c);color:#3a2308;font:700 3.1vh Georgia,serif;display:grid;place-items:center;box-shadow:0 .4vh 1vh #000a;padding:0}
.mk:hover{background:#ff8d8d;border-color:#fff}

/* spirit meter */
#spP{background:linear-gradient(180deg,#14243a,#1b1a3a);border:1px solid #35507a;padding-left:1.8vh;padding-right:.5vh}
#spP .head{padding:0 1.1vh}
#sliders{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around}
.sl{display:grid;grid-template-columns:3.4vh 4.6em 1fr 4.6em;align-items:center;gap:.8vh;transition:opacity .15s}
.sl.off{opacity:.38}
.sl.off input[type=range]{cursor:not-allowed}
.sl.off input[type=range]::-webkit-slider-thumb{opacity:0;box-shadow:none}
.sl.off input[type=range]::-moz-range-thumb{opacity:0;box-shadow:none}
.tg{width:3.4vh;height:3.4vh;border-radius:.9vh;border:.35vh solid #6b7da0;background:#0004;padding:0;display:grid;place-items:center;color:transparent;font-weight:700;line-height:1}
.tg[aria-pressed=true]{background:var(--ecto);border-color:var(--ecto);color:#0f2b27}
.sl .l{text-align:right}.sl .r{text-align:left}
.sl span{color:#cfe4ff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4.4vh;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1.2vh;border-radius:1vh;background:linear-gradient(90deg,#2d4366,#7fe3d1 50%,#2d4366)}
input[type=range]::-moz-range-track{height:1.2vh;border-radius:1vh;background:linear-gradient(90deg,#2d4366,#7fe3d1 50%,#2d4366)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3.6vh;height:3.6vh;border-radius:50%;background:#eaf6ff;border:.5vh solid var(--ecto);margin-top:-1.2vh;box-shadow:0 0 1.6vh var(--ecto)}
input[type=range]::-moz-range-thumb{width:3.6vh;height:3.6vh;border-radius:50%;background:#eaf6ff;border:.5vh solid var(--ecto);box-shadow:0 0 1.6vh var(--ecto)}
input.color::-webkit-slider-runnable-track{background:linear-gradient(90deg,#000 0,hsl(0 100% 50%) 8%,hsl(60 100% 50%) 22%,hsl(120 100% 50%) 36%,hsl(180 100% 50%) 50%,hsl(240 100% 50%) 64%,hsl(300 100% 50%) 78%,hsl(340 100% 50%) 92%,#fff 100%)}
input.color::-moz-range-track{background:linear-gradient(90deg,#000 0,hsl(0 100% 50%) 8%,hsl(60 100% 50%) 22%,hsl(120 100% 50%) 36%,hsl(180 100% 50%) 50%,hsl(240 100% 50%) 64%,hsl(300 100% 50%) 78%,hsl(340 100% 50%) 92%,#fff 100%)}
input.color::-webkit-slider-thumb{background:var(--c,#fff);border-color:#fff}
input.color::-moz-range-thumb{background:var(--c,#fff);border-color:#fff}
.swatch{display:inline-block;width:2.6em;height:2.6em;border-radius:50%;border:.4vh solid #fff;vertical-align:middle;background:var(--c,#fff);box-shadow:0 0 1.4vh var(--c,#fff)}
</style>
</head>
<body>
<div id="app">
  <section class="panel" id="bodyP">
    <div class="head"><h2>The Victim</h2><button class="mini" id="clrB">Clear wounds <b id="cnt">0</b></button></div>
    <div id="stage">
      <svg id="bsvg" viewBox="0 0 400 620" preserveAspectRatio="xMidYMid meet" aria-label="Chalk outline of the body. Click to add a wound, click a wound to remove it.">
        <defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter></defs>
        <g id="outline" fill="none" stroke="#f3f1ea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)" opacity=".92"><circle cx="200" cy="66" r="42"/><path id="bodyPath"/></g>
        <g id="toks"></g>
      </svg>
      <button id="sex" title="Switch male / female" aria-label="Switch sex"></button>
    </div>
    <textarea id="desc" rows="1" placeholder="One-line description of the body…" aria-label="Body description"></textarea>
  </section>

  <section class="panel" id="ouP">
    <div class="head"><h2>OUIJA</h2><button class="mini" id="clrO">Clear markers <b id="cntO">0</b></button></div>
    <div id="ouija"></div>
  </section>

  <section class="panel" id="spP">
    <div class="head"><h2>Spirit Meter</h2><button class="mini" id="clrS">Reset</button></div>
    <div id="sliders"></div>
  </section>
</div>

<script>
(function(){
var KEY="pd-sandbox-v2";
var GROUPS=["OEA","UYI","NST","DRH","MLC","GFW","BVP","QKX","JZV"];
var CATS=[["Big","Small"],["Heavy","Light"],["Fast","Slow"],["Good","Evil"],["Loud","Silent"],["Hot","Cold"],["New","Old"]];
var S={sex:"m",wounds:[],desc:"",marks:[],sl:CATS.map(function(){return 50}).concat([50]),on:CATS.map(function(){return false}).concat([false])};
try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.sl&&d.sl.length===8){S=d;if(!S.on||S.on.length!==8)S.on=S.sl.map(function(){return false})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)},NS="http://www.w3.org/2000/svg";

/* ---------- body ---------- */
function bodyPts(m){
  var s=m?84:66,w=m?66:52,h=m?72:86,r=[
    [18,118],[s*.55,124],[s,138],[s+62,196],[s+104,290],[s+98,322],[s+70,326],[s+58,300],[s+38,246],[s-6,208],
    [w,272],[h,346],[h+10,430],[h+6,520],[h+14,566],[h-6,592],[34,590],[26,560],[28,470],[12,392]];
  var L=r.slice(0,-1).reverse().map(function(p){return[-p[0],p[1]]});
  // right side top→bottom, crotch, then left bottom→top
  return r.map(function(p){return[200+p[0],p[1]]}).concat([[200,384]],L.map(function(p){return[200+p[0],p[1]]}));
}
function smooth(p){
  var d="M"+p[0][0]+" "+p[0][1];
  for(var i=0;i<p.length-1;i++){
    var a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=" C"+(b[0]+(c[0]-a[0])/6)+" "+(b[1]+(c[1]-a[1])/6)+","+(c[0]-(e[0]-b[0])/6)+" "+(c[1]-(e[1]-b[1])/6)+","+c[0]+" "+c[1];
  }
  return d;
}
function sexIcon(){
  var m=S.sex==="m";
  $("sex").innerHTML=m
   ?'<svg viewBox="0 0 64 64" fill="none" stroke="#7fb8ff" stroke-width="6" stroke-linecap="round"><circle cx="26" cy="38" r="16"/><path d="M38 26 54 10M40 10h14v14"/></svg>'
   :'<svg viewBox="0 0 64 64" fill="none" stroke="#ff9fd0" stroke-width="6" stroke-linecap="round"><circle cx="32" cy="24" r="16"/><path d="M32 40v20M22 51h20"/></svg>';
  $("sex").setAttribute("aria-label",m?"Male – click to switch":"Female – click to switch");
  $("bodyPath").setAttribute("d",smooth(bodyPts(m)));
}
function drawToks(){
  var g=$("toks");g.innerHTML="";
  S.wounds.forEach(function(w,i){
    var t=document.createElementNS(NS,"g");t.setAttribute("class","tok");t.dataset.i=i;
    t.setAttribute("transform","translate("+w[0]+" "+w[1]+")");
    t.innerHTML='<path d="M0-22C8-10 15-2 15 8A15 15 0 0 1-15 8C-15-2-8-10 0-22Z" fill="#c4172b" stroke="#6e0a16" stroke-width="3"/><ellipse cx="-5" cy="3" rx="3.5" ry="6" fill="#ff7b8a" opacity=".7" transform="rotate(20 -5 3)"/>';
    g.appendChild(t);
  });
  $("cnt").textContent=S.wounds.length;
}
var svg=$("bsvg"),drag=null;
function pt(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener("pointerdown",function(e){
  var t=e.target.closest(".tok"),p=pt(e);
  if(t){drag={i:+t.dataset.i,el:t,sx:p.x,sy:p.y,moved:false};svg.setPointerCapture(e.pointerId)}
  else{S.wounds.push([Math.round(p.x),Math.round(p.y)]);save();drawToks()}
});
svg.addEventListener("pointermove",function(e){
  if(!drag)return;var p=pt(e);
  if(Math.abs(p.x-drag.sx)+Math.abs(p.y-drag.sy)>6)drag.moved=true;
  if(drag.moved){S.wounds[drag.i]=[Math.round(p.x),Math.round(p.y)];drag.el.setAttribute("transform","translate("+p.x+" "+p.y+")")}
});
function endDrag(){if(!drag)return;if(!drag.moved)S.wounds.splice(drag.i,1);drag=null;save();drawToks()}
svg.addEventListener("pointerup",endDrag);svg.addEventListener("pointercancel",endDrag);
$("sex").onclick=function(){S.sex=S.sex==="m"?"f":"m";save();sexIcon()};
$("clrB").onclick=function(){S.wounds=[];save();drawToks()};
var desc=$("desc");
function growDesc(){desc.style.height="auto";desc.style.height=desc.scrollHeight+"px"}
desc.value=S.desc;
desc.oninput=function(){S.desc=this.value;save();growDesc()};
desc.onkeydown=function(e){if(e.key==="Enter")e.preventDefault()};
growDesc();
if(window.ResizeObserver)new ResizeObserver(growDesc).observe($("bodyP"));else window.addEventListener("resize",growDesc);

/* ---------- ouija ---------- */
function drawOuija(){
  var o=$("ouija");o.innerHTML="";
  GROUPS.forEach(function(gr,gi){
    var b=document.createElement("div");b.className="grp";b.tabIndex=0;b.setAttribute("role","button");
    b.setAttribute("aria-label","Group "+gr+" – add marker");
    var L=document.createElement("div");L.className="letters";var ch=gr.split("").map(function(c){return"<span>"+c+"</span>"});L.innerHTML='<span class="row">'+ch.slice(0,2).join("")+'</span><span class="row">'+ch.slice(2).join("")+"</span>";b.appendChild(L);
    var m=document.createElement("div");m.className="marks";
    S.marks.forEach(function(g,n){if(g===gi){
      var k=document.createElement("button");k.className="mk";k.textContent=n+1;k.title="Remove marker "+(n+1);
      k.onclick=function(e){e.stopPropagation();S.marks.splice(n,1);save();drawOuija()};
      m.appendChild(k)}});
    b.appendChild(m);
    var add=function(){S.marks.push(gi);save();drawOuija()};
    b.onclick=add;b.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();add()}};
    o.appendChild(b);
  });
  $("cntO").textContent=S.marks.length;
  fitOuija();
}
/* One line when every group fits; otherwise all groups use two lines (2+1); shrink only if two lines still don't fit. */
function fitOuija(){
  var o=$("ouija"),cells=o.querySelectorAll(".grp");if(!cells.length)return;
  function over(){return Array.prototype.some.call(cells,function(c){
    return c.querySelector(".letters").getBoundingClientRect().width>c.clientWidth-8})}
  o.classList.remove("two");o.style.setProperty("--ls",1);
  if(!over())return;
  o.classList.add("two");
  for(var k=1;k>.25&&over();k-=.05)o.style.setProperty("--ls",k);
}
if(window.ResizeObserver)new ResizeObserver(function(){fitOuija()}).observe($("ouija"));
else window.addEventListener("resize",fitOuija);
$("clrO").onclick=function(){S.marks=[];save();drawOuija()};

/* ---------- spirit meter ---------- */
function colorAt(v){
  var t=v/100;
  if(t<.08)return"hsl(0 100% "+(50*t/.08)+"%)";
  if(t>.92)return"hsl(340 100% "+(50+50*(t-.92)/.08)+"%)";
  return"hsl("+(340*(t-.08)/.84)+" 100% 50%)";
}
function row(i,left,right,color){
  var r=document.createElement("div");r.className="sl";
  r.innerHTML='<button class="tg" type="button"></button><span class="l">'+left+'</span><input type="range" min="0" max="100"'+(color?' class="color"':'')+'><span class="r">'+right+'</span>';
  var tg=r.querySelector(".tg"),inp=r.querySelector("input"),sw=null;
  inp.setAttribute("aria-label",color?"Color":left+" versus "+right);
  if(color){sw=document.createElement("i");sw.className="swatch";r.querySelector(".l").appendChild(sw)}
  inp.value=S.sl[i];
  function paint(){
    r.classList.toggle("off",!S.on[i]);inp.disabled=!S.on[i];
    tg.setAttribute("aria-pressed",S.on[i]);tg.textContent=S.on[i]?"\u2713":"";
    tg.setAttribute("aria-label",(color?"Color":left+" versus "+right)+(S.on[i]?" – on, click to turn off":" – off, click to turn on"));
    if(color){var c=colorAt(+inp.value);inp.style.setProperty("--c",c);sw.style.setProperty("--c",c)}
  }
  tg.onclick=function(){S.on[i]=!S.on[i];save();paint()};
  inp.oninput=function(){S.sl[i]=+inp.value;paint();save()};
  paint();return r;
}
function drawSliders(){
  var c=$("sliders");c.innerHTML="";
  CATS.forEach(function(k,i){c.appendChild(row(i,k[0],k[1],false))});
  c.appendChild(row(7,"","Color",true));
}
$("clrS").onclick=function(){S.sl=S.sl.map(function(){return 50});S.on=S.sl.map(function(){return false});save();drawSliders()};

sexIcon();drawToks();drawOuija();drawSliders();
})();
</script>
</body>
</html>
